<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Page not found</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#FFF7EC;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#3B2A1E;text-align:center}
svg{width:min(340px,80vw);height:auto}
h1{font-size:clamp(28px,6vw,40px);margin:10px 0 6px}
p{margin:0;font-size:17px;color:#7A5C45}
.ball{animation:bounce 1s cubic-bezier(.3,0,.7,1) infinite alternate}
.tail{transform-origin:206px 196px;animation:wag .35s ease-in-out infinite alternate}
.ear{transform-origin:118px 92px;animation:flop 1.2s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-46px)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes flop{from{transform:rotate(0)}to{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.ball,.tail,.ear{animation:none}}
</style>
</head>
